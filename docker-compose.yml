version: "3.8"
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./server
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/bookme
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - backend
