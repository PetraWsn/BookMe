name: BookMe CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. BYGG-STEGET
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          cd server && npm install
          cd ../client && npm install && (npm run build || echo "No build script")

  # 2. SÄKERHETSSCAN (KOD & BEROENDEN)
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Dependency scan (SCA)
        run: |
          cd server && npm audit --audit-level=high
          cd ../client && npm audit --audit-level=high || echo "Client SCA check completed"

  # 3. DOCKER-SCAN (CONTAINER-SÄKERHET)
  docker-scan:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Scan Backend
        run: docker build -t bookme-backend ./server

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookme-backend
          severity: CRITICAL
          exit-code: 1

      - name: Build and Scan Frontend
        run: docker build -t bookme-frontend ./client

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookme-frontend
          severity: CRITICAL
          exit-code: 1

  # 4. DAST-SCAN (KÖRANDE APPLIKATIONSTEST)
  dast-scan:
    runs-on: ubuntu-latest
    needs: docker-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Startar hela miljön (Mongo, Redis, Backend, Frontend)
      - name: Start Services with Docker Compose
        run: docker-compose up -d

      # Vänta på att allt startat ordentligt
      - name: Wait for Environment
        run: |
          echo "Väntar på att tjänsterna ska starta..."
          sleep 20
          curl -v http://localhost:5173 || echo "Frontend inte redo än"

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:5173"
          fail_on_risk: "High"

      # Sparar rapporten så du kan ladda ner den från GitHub Actions-fliken
      - name: Upload DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap_report.html

      - name: Stop Services
        if: always()
        run: docker-compose down
