name: BookMe CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd server
          npm install

      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      - name: Build frontend
        run: |
          cd client
          npm run build || echo "No build script"

  security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SAST med CodeQL
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/javascript"

      # SCA – dependency scanning
      - name: Dependency scan (SCA) for backend
        run: |
          cd server
          npm audit --audit-level=high

      - name: Dependency scan (SCA) for frontend
        run: |
          cd client
          npm audit --audit-level=high || echo "No high severity vulnerabilities"

  docker-scan:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t bookme-backend ./server

      - name: Scan backend container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookme-backend
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Build frontend Docker image
        run: docker build -t bookme-frontend ./client

      - name: Scan frontend container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookme-frontend
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
