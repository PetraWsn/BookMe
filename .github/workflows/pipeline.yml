name: BookMe CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. BYGG-STEGET
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          cd server && npm install
          cd ../client && npm install && (npm run build || echo "No build script")

  # 2. SÄKERHETSSCAN (KOD & BEROENDEN)
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Dependency scan (SCA)
        run: |
          cd server && npm audit --audit-level=high
          cd ../client && npm audit --audit-level=high || echo "Client SCA check completed"

  # 3. DOCKER-SCAN (CONTAINER-SÄKERHET)
  docker-scan:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Scan Backend
        run: docker build -t bookme-backend ./server

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookme-backend
          severity: CRITICAL
          exit-code: 1

      - name: Build and Scan Frontend
        run: docker build -t bookme-frontend ./client

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookme-frontend
          severity: CRITICAL
          exit-code: 1

  # 4. DAST-SCAN (KÖRANDE APPLIKATIONSTEST)
  dast-scan:
    runs-on: ubuntu-latest
    needs: docker-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services with Docker Compose
        run: docker compose up -d

      - name: Wait for Environment
        run: |
          echo "Väntar på att tjänster ska starta ordentligt..."
          # Vi kollar om vi får ett 200 OK svar innan vi går vidare
          timeout 60s bash -c 'until curl -Is http://localhost:5173 | grep "200 OK"; do sleep 5; done'

      - name: Run OWASP ZAP Full Scan
        run: |
          # Skapa filen med fulla rättigheter
          touch zap_report.html
          chmod 777 zap_report.html

          # Kör mot FRONTEND (5173). Den kommer hitta formulären som går till backend.
          docker run --rm -v $(pwd):/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:5173 \
            -r zap_report.html \
            -j -a \
            -z "-config scanner.guessAllQueryParameters=true -config scanner.injectSpiderParameters=true" || echo "Scan completed with alerts"

      - name: Upload DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap_report.html

      - name: Stop Services
        if: always()
        run: docker compose down
